# Build the ttmouse Docker image and publish it to the GitHub Container Registry
# (ghcr.io/vadimvasilyev1994/ttmouse), where the Edinburgh Shiny server pulls it.
#
# Runs when a version tag is pushed (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# or manually from the repo's Actions tab ("Run workflow").
# Each build is tagged `latest` plus, for tag pushes, the version (e.g. `1.0.0`).

name: Build and publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io with the built-in token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The .rds model files are stored in Git LFS: without lfs: true the image
      # would contain small pointer files and the app would fail at startup.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags: always `latest`; for a v1.2.3 tag push, also `1.2.3`.
      # (Registry names must be lower-case, hence the hard-coded image name.)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vadimvasilyev1994/ttmouse
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # Build from the repo's Dockerfile and push. The GitHub Actions cache keeps
      # the slow package-install layer between builds while renv.lock is unchanged.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
